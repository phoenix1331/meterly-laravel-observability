global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

# No Alertmanager is wired up in this thin slice. Alert state (firing/
# pending/inactive) is fully queryable at :9090/api/v1/rules and visible
# in Prometheus's own UI, which is enough to verify the alerting story
# without adding a fifth service just to route notifications nowhere.
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # /prometheus, not /metrics: spatie/laravel-prometheus's default route
  # name (see config/prometheus.php's 'urls' key); matching this to the
  # actual route was a real bug caught during the metrics task, not a
  # convention to assume.
  - job_name: meterly
    metrics_path: /prometheus
    static_configs:
      - targets: ["app:8000"]
