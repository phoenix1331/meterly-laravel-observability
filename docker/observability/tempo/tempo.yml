server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 48h

# Derives Prometheus metrics from every span Tempo receives and
# remote-writes them, exemplars attached. This is what produces
# traces_spanmetrics_latency_bucket (see prometheus.yml and the
# Grafana dashboard) and is the entire mechanism behind the
# metric-to-trace leg of the correlation triangle, since the app's own
# Prometheus histogram can't carry exemplars itself.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      # span-metrics: produces traces_spanmetrics_* (latency, calls,
      # size). service-graphs: produces traces_service_graph_* for
      # Grafana's node graph panel.
      processors: [service-graphs, span-metrics]
