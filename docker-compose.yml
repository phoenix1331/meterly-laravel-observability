services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Runs AggregateUsageEvents (and any other queued job) off Redis.
  # healthcheck disabled: the FrankenPHP base image's inherited
  # healthcheck pings Caddy's admin port, which is never listening here
  # since this container runs `artisan horizon`, not the web server.
  # Left enabled it always reports unhealthy despite working correctly.
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "artisan", "horizon"]
    volumes:
      - .:/app
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  # Drives routes/console.php's Schedule:: entries. Without this
  # process running, `Schedule::command('app:aggregate-usage')` never
  # actually fires; Laravel's scheduler is inert without something
  # calling `artisan schedule:run` every minute, which is what
  # `schedule:work` does in a loop. Same healthcheck reasoning as
  # horizon above.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/app
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=meterly
      - MYSQL_USER=meterly
      - MYSQL_PASSWORD=meterly
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - meterly-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - meterly-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --web.enable-remote-write-receiver: lets Tempo's metrics-generator
  # push span-derived metrics here (see tempo.yml's remote_write block),
  # off by default in Prometheus 3.x.
  # --enable-feature=exemplar-storage: without this, exemplars arriving
  # via remote-write are silently discarded even though the write itself
  # succeeds; this is what makes the correlation triangle's metric-to-
  # trace exemplar link work at all.
  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - meterly-prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - meterly-loki:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:2.6.1
    command: -config.file=/etc/tempo/tempo.yml
    ports:
      - "3200:3200"
    volumes:
      - ./docker/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - meterly-tempo:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      prometheus:
        condition: service_healthy

  # The one collector: receives traces over OTLP (4317 gRPC, 4318 HTTP;
  # the app uses HTTP, see OTEL_EXPORTER_OTLP_* in .env.example) and
  # separately tails Docker container logs via the mounted socket (see
  # config.alloy's discovery.docker block) to push structured logs to
  # Loki. Two unrelated collection paths in one process.
  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./docker/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only Docker socket access, so Alloy can discover and tail
      # the app/horizon/scheduler containers' own log streams directly.
      # The app never talks to Loki itself.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy

  # Anonymous admin access is deliberate, not a security oversight: the
  # brief's target is `git clone && make demo` to a populated dashboard
  # with no accounts, in under fifteen minutes. Never do this for a
  # deployment reachable outside localhost.
  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=exemplars
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - meterly-grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meterly-mysql:
  meterly-redis:
  meterly-prometheus:
  meterly-loki:
  meterly-tempo:
  meterly-grafana:
